·연도와 함께 “사업 참여율이 20% 증가했다”고 설명했습니다. 이 수치를 검토보고서에 사용하려고 합니다.","prompt":"이후 무엇을 하겠습니까?","options":["발행기관과 보고서명이 구체적이므로 출처를 적어 활용한다.","보고서를 직접 찾아 해당 수치와 산정 대상·기간·의미가 AI 설명과 일치하는지 확인한다.","같은 내용을 다른 검색서비스에서 찾은 다음, 숫자가 일치하면 활용한다.","AI에게 산출 과정을 더 설명하도록 요청하고 설명의 일관성을 확인한다."],"kind":"single","limit":null,"min_select":null,"exclusive":[],"other":null,"case":false,"hint":null},{"n":7,"section":1,"title":"실제로 존재하는 지침","intro":"AI가 이번 사업에 적용할 수 있다며 공식 지침의 조항을 제시했습니다.\n\n직접 확인하니 조항은 실제로 존재하고 인용한 문구도 정확합니다. 다만 그 조항은 특정 대상과 요건을 전제로 합니다.","prompt":"검토의견을 정리하기 전에 무엇을 가장 중점적으로 살펴보겠습니까?","options":["AI에게 이번 사업에 적용되는 이유를 다시 설명하게 하여 답변의 일관성을 확인한다.","같은 조항을 언급한 다른 기관의 검토 사례를 찾아 이번 사업과 유사한지 살펴본다.","해당 조항을 보고서에 정확히 인용하고 적용 가능성은 담당부서 검토사항으로 남긴다.","이번 사업의 대상·조건·예외가 그 조항의 요건에 부합하는지 원문과 사실관계를 대조한다."],"kind":"single","limit":null,"min_select":null,"exclusive":[],"other":null,"case":false,"hint":null},{"n":8,"section":1,"title":"보고서 초안에서 수정할 부분 찾기","intro":"위 초안을 보고에 사용하려고 합니다.","prompt":"요청사항과 원자료에 비추어 내용의 수정·보완이 필요하다고 판단되는 부분을 모두 선택해 주세요.","options":["㉠ 운영 개요","㉡ 대기시간 결과","㉢ 담당자 의견","㉣ 향후 계획","수정·보완할 부분이 없다"],"kind":"multi","limit":null,"min_select":null,"exclusive":[4],"other":null,"case":true,"hint":"단순한 문체나 표현 취향은 제외해 주세요."},{"n":9,"section":1,"title":"발견한 문제와 관련된 AI 출력의 위험","intro":"","prompt":"앞서 확인한 문제는 AI가 작성한 초안에서 나타날 수 있는 어떤 위험과 관련이 있다고 생각하십니까? 해당하는 것을 모두 선택해 주세요.","options":["AI는 요청과 문맥에 따라 정보를 선택·압축하므로, 요청에서 남겨 달라고 한 중요한 내용도 요약에서 빠질 수 있다.","AI는 긍정적·부정적 의견이 함께 있으면, 더 많은 사람이 제시한 의견을 중심으로 나머지 의견을 제외한다.","AI는 원문의 표현을 재구성하면서, 원자료가 뒷받침하는 범위보다 강한 해석이나 결론을 덧붙일 수 있다.","AI는 수치의 차이를 계산하면, 그 차이가 발생한 원인도 함께 확인하여 설명한다.","수정·보완할 부분은 있다고 생각하지만, 어떤 위험과 관련되는지는 잘 모르겠다.","앞에서 수정·보완할 부분이 없다고 판단했다."],"kind":"multi","limit":null,"min_select":null,"exclusive":[4,5],"other":null,"case":true,"hint":"8번에서 선택한 내용을 바꾸려면 ‘이전’ 버튼을 이용하세요."},{"n":10,"section":1,"title":"대화를 이어가며 구체화된 대안","intro":"사업 운영방식으로 A안과 B안을 검토하고 있습니다. 본인은 다른 부서와 협의할 일이 적은 B안에 마음이 갑니다.\n\nAI에게 A안의 협의 부담과 B안의 장점을 주로 물었고, B안의 단점에 대한 보완책도 곧바로 받았습니다. 대화를 이어갈수록 B안이 더 적절하다는 확신이 듭니다.","prompt":"최종 의견을 정하기 전에, 다음 중 무엇을 가장 우선하여 확인하겠습니까?","options":["B안의 보완책을 실행계획으로 구체화하고, 실제 업무에서 추진할 수 있는지 확인한다.","AI에게 B안의 추진 논리와 보완책을 종합하게 하고, 내용 사이에 모순이 없는지 확인한다.","다른 AI에게도 B안의 장단점과 보완책을 제시하고, 추진 가능성에 대한 판단이 비슷한지 확인한다.","두 안을 검토하며 질문을 한쪽에 유리하게 하지 않았는지 돌아보고, 같은 기준으로 장단점을 다시 비교한다."],"kind":"single","limit":null,"min_select":null,"exclusive":[],"other":null,"case":false,"hint":null},{"n":11,"section":1,"title":"AI가 작성한 개선계획","intro":"주민교육 프로그램의 참여율이 낮아 개선방안을 찾고 있습니다. AI에게 프로그램 목록과 참여율을 알려주자, 온라인 신청방식 도입을 제안했습니다.\n\n이어서 AI는 신청화면 구성, 홍보문안, 운영일정, 문의 대응안까지 정리했습니다. 계획은 구체적이고 바로 추진할 수 있을 것처럼 보입니다.","prompt":"다음은 모두 이 계획을 검토할 때 필요한 사항입니다. 이 중 ‘이 계획이 실제로 참여율을 높이는 데 적합한가’를 판단하기 위해 가장 핵심적인 사항 2개를 선택해 주세요.","options":["온라인 신청을 도입할 경우, 신청화면의 구성과 안내문이 이용하기 편리하게 설계되어 있는가?","참여율이 낮은 주된 이유가 신청의 불편인지, 교육 내용·시간·장소 등 다른 요인인지 확인했는가?","홍보 일정과 매체가 적절하며, 주민에게 충분히 알릴 수 있도록 준비되어 있는가?","주요 이용자가 온라인 신청방식을 이용할 수 있으며, 이용이 어려운 주민의 신청 경로도 마련할 수 있는가?","신청 접수와 문의 대응의 역할이 명확하고, 담당자 간 협의가 이루어졌는가?"],"kind":"multi","limit":2,"min_select":2,"exclusive":[],"other":null,"case":false,"hint":null},{"n":12,"section":1,"title":"AI를 활용한 해결방안 결정","intro":"특정 업무의 문제를 해결하기 위해 여러 대안 중 하나를 결정해야 하는 상황입니다.\n\n담당자는 AI를 활용하여 네 가지 대안의 장단점과 실행 가능성을 분석하고, 추천안도 제시받았습니다. 이후 대안별 주요 사실관계는 확인했습니다.","prompt":"다음 중 해결방안을 검토·결정하는 방식으로 가장 우려되는 것은 무엇입니까?","options":["내가 직접 결정하기 어려워 네 가지 대안의 장단점과 주요 쟁점을 균형 있게 정리하고, 최종 선택은 상급자의 판단에 맡긴다.","AI가 추천한 안에도 불구하고, 분석에는 미처 반영되지 못한 비상근무 누적에 따른 직원들의 피로도와 추가 업무부담을 고려하여 다른 안으로 결정한다.","AI가 비용·효과·실행 가능성을 종합적으로 평가하게 하고, 그 평가에서 가장 현실성이 높다고 나온 안을 선택한다.","AI가 추천한 안을 추가로 심도 있게 검토하고, AI와 함께 예상 문제와 보완방안을 구체화하여 개선된 안으로 결정한다."],"kind":"single","limit":null,"min_select":null,"exclusive":[],"other":null,"case":false,"hint":null},{"n":13,"section":1,"title":"이해하기 어려운 AI의 분석","intro":"공공시설의 향후 이용 수요를 예측하기 위해 AI에게 과거 이용실적과 인구자료를 분석하도록 했습니다.\n\nAI는 전문적인 통계기법을 활용하여 향후 3년간 이용 수요가 약 25% 증가할 것이라는 결과를 제시했습니다.\n\n분석 과정과 설명은 논리적으로 보이지만, 담당자는 사용된 통계기법과 주요 가정이 적절한지 충분히 이해하거나 확인하기 어렵습니다.","prompt":"이 분석 결과를 사업계획 보고서에 활용하려고 합니다. 다음 중 가장 적절한 대응은 무엇입니까?","options":["AI에게 어려운 분석내용을 비유와 쉬운 표현으로 다시 설명하도록 하고, 그 설명을 충분히 숙지하여 보고서에 반영한다.","다른 AI에게도 같은 자료를 분석하도록 하여 비슷한 예측 결과가 나오는지 확인한 후 보고서에 반영한다.","파악하고 확인할 수 있는 자료를 중심으로 보고서를 작성하고, 이해하지 못한 내용은 제외한다.","AI의 예측 결과를 참고자료로 활용하되, 전문적인 통계기법에 따른 추정치로서 불확실성이 있다는 점을 명시한다."],"kind":"single","limit":null,"min_select":null,"exclusive":[],"other":null,"case":false,"hint":null},{"n":14,"section":2,"title":"앞서 알려준 기준을 활용하는 AI","intro":"담당자는 AI에게 “이번 검토에서는 2026년 10월 1일 기준 재직자만 대상으로 해 줘”라고 요청했습니다.\n\n이후 같은 대화에서 자료를 추가하며 “앞서 정한 기준으로 대상자를 정리해 줘”라고 하자, AI는 기준일과 재직 여부를 정확히 적용했습니다.","prompt":"이 상황을 설명한 내용으로 가장 적절한 것은 무엇입니까?","options":["AI가 대화를 통해 새로운 기준을 학습했으므로, 이후 다른 사용자가 같은 업무를 질문할 때도 이 기준을 활용할 수 있다.","AI가 현재 대화의 앞선 내용을 참고해 답변한 것으로, 이 사실만으로 대화기록의 저장 여부나 모델 학습에 활용되는지는 판단할 수 없다.","AI가 기준을 정확히 다시 적용한 것으로 보아, 해당 기준은 계정에 저장되어 새 대화에서도 유지된다고 볼 수 있다.","AI가 같은 대화 안에서만 기준을 활용했으므로, 해당 내용은 대화가 끝나면 저장되거나 모델 학습에 사용되지 않는다고 볼 수 있다."],"kind":"single","limit":null,"min_select":null,"exclusive":[],"other":null,"case":false,"hint":null},{"n":15,"section":2,"title":"유료 AI 서비스와 업무자료 입력","intro":"담당자가 외부 AI 서비스를 이용해 공개되지 않은 내부 검토자료를 요약하려고 합니다.\n\n유료 계정을 사용하고 있으며, 입력한 내용이 AI 모델 학습에 이용되지 않도록 설정했습니다. 자료에는 이름이나 전화번호 같은 개인정보도 포함되어 있지 않습니다.","prompt":"이 상황에 대한 설명으로 가장 적절한 것은 무엇입니까?","options":["유료 계정에서 학습 활용을 제외했으므로, 자료의 민감도에 따른 입력 여부는 담당자가 판단하면 된다.","개인정보가 없는 자료이므로, 내부 검토내용 중 필요한 부분만 발췌하면 입력할 수 있다.","요약 후 대화기록과 첨부파일을 삭제하는 조건으로, 필요한 동안 자료를 입력해 활용할 수 있다.","학습 활용을 제외했더라도, 외부 전송·처리 조건과 기관의 자료 입력 허용 기준을 확인해야 한다."],"kind":"single","limit":null,"min_select":null,"exclusive":[],"other":null,"case":false,"hint":null},{"n":16,"section":3,"title":"AI 업무활용의 어려움","intro":"","prompt":"생성형 AI를 업무에 활용할 때 가장 어렵게 느끼는 것은 무엇입니까?","options":["어떤 업무에 활용하면 좋을지 판단하기 어렵다.","원하는 결과를 얻도록 질문이나 요청을 구성하기 어렵다.","AI가 제시한 내용의 정확성을 다시 확인하는 데 부담이 있다.","개인정보·내부자료를 어디까지 활용할 수 있는지 판단하기 어렵다.","업무에 활용할 수 있는 AI 환경이나 도구가 충분하지 않다.","업무 특성상 AI를 활용할 부분이 많지 않다.","특별한 어려움이 없다.","활용 경험이 없어 판단하기 어렵다.","기  두 집단의 민원 종류와 접수 시간대가 같은지는 확인하지 않았습니다.","담당자 5명 중 3명은 창구 혼잡이 줄었다고 응답했습니다. 다만 예약 확인·변경 업무가 추가로 발생했습니다.","운영기간을 늘리고 비교조건을 보완하여, 사전예약제가 대기시간 감소에 영향을 주었는지 추가로 확인할 예정입니다."],"draft":[["㉠ 운영 개요","2개 읍·면에서 4주간 민원 사전예약제를 시범운영했다."],["㉡ 대기시간 결과","예약 이용자의 평균 대기시간은 현장 접수보다 7분 짧아, 사전예약제의 대기시간 단축 효과가 확인되었다."],["㉢ 담당자 의견","담당자 5명 중 3명이 창구 혼잡 완화를 체감했다."],["㉣ 향후 계획","운영기간을 늘리고 비교조건을 보완하여 사전예약제가 대기시간 감소에 영향을 주었는지 추가로 확인할 예정이다."]]}};
const questions=DATA.questions;
const SECTIONS=['생성형 AI 활용 현황','AI 업무활용 상황에서의 검토·판단','생성형 AI에 대한 기본 이해','업무활용의 어려움과 교육·지원 수요','기본 정보'];
const answer={};const otherAnswer={};let page='welcome',number=1,caseExpanded=false;
const root=document.getElementById('app');
const escapeHTML=x=>String(x).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
const circled=i=>String.fromCodePoint(9312+i);
function activeQuestions(){return questions.filter(q=>q.n!==9||!(answer[8]||[]).includes(4));}
function findQ(n){return questions.find(q=>q.n===n)}
function valid(q){const vals=answer[q.n]||[];if(vals.length===0)return false;if(q.min_select&&vals.length<q.min_select)return false;return true;}
function answeredCount(){return activeQuestions().filter(valid).length;}
function gotoTop(){window.scrollTo({top:0,behavior:'instant'});}
function onStart(){page='question';number=1;render();}
function questionHeader(q){const arr=activeQuestions();const idx=arr.findIndex(x=>x.n===q.n);const prev=idx>0?arr[idx-1]:null;const isNextSection=prev&&prev.section!==q.section;
const pct=Math.round(idx/arr.length*100);
return `<div class="progressrow"><span class="subsection">${escapeHTML(SECTIONS[q.section])}</span><span class="count">${idx+1} / ${arr.length}</span></div><div class="flowline" role="progressbar" aria-label="설문 진행" aria-valuenow="${idx}" aria-valuemin="0" aria-valuemax="${arr.length}"><div class="fill" style="width:${pct}%"></div></div>${isNextSection?`<div class="section-switch" style="margin-top:20px">${escapeHTML(SECTIONS[q.section])} 영역입니다.</div>`:''}`;}
function makeCase(q){const c=DATA.case;
const source=`<div class="casetop"><strong>AI에게 요청한 내용</strong><div>“${escapeHTML(c.request)}”</div></div><div class="casecard"><div class="casehead">원자료</div><div class="casebody"><ul>${c.source.map(t=>`<li>${escapeHTML(t)}</li>`).join('')}</ul></div></div><div class="casecard"><div class="casehead">AI가 작성한 보고서 초안</div><div class="casebody">${c.draft.map(x=>`<div class="airow"><span class="ailabel">${escapeHTML(x[0])}</span>${escapeHTML(x[1])}</div>`).join('')}</div></div>`;
 if(q.n===8)return `<div class="casewrap"><div class="casesummary">8·9번 공통 사례 · 민원 사전예약제 시범운영</div>${source}</div>`;
 return `<div class="casewrap"><button class="casesummarytoggle" type="button" id="toggleCase" aria-expanded="${caseExpanded}">${caseExpanded?'⌃ 공통 원자료와 AI 초안 접기':'⌄ 공통 원자료와 AI 초안 다시 보기'}</button>${caseExpanded?`<div class="case-toggle">${source}</div>`:''}</div>`;
}
function makeChoices(q){const vals=answer[q.n]||[];return `<div class="choices" role="group" aria-label="${escapeHTML(q.prompt)}">${q.options.map((label,i)=>{let checked=vals.includes(i);return `<div><label class="choice" aria-multiselectable="${q.kind==='multi'}"><input type="${q.kind==='single'?'radio':'checkbox'}" name="answer${q.n}" data-index="${i}" ${checked?'checked':''}><span class="mark" aria-hidden="true">${checked?(q.kind==='multi'?'✓':'●'):circled(i)}</span><span class="opttext">${escapeHTML(label)}</span></label>${q.other===i&&checked?`<input class="otherbox" id="otherInput" type="text" value="${escapeHTML(otherAnswer[q.n]||'')}" placeholder="기타 내용을 입력해 주세요 (선택)" aria-label="기타 내용">`:''}</div>`;}).join('')}</div>`;}
function render(){if(page==='welcome')return renderWelcome();if(page==='review')return renderReview();if(page==='done')return renderDone();renderQuestion();}
function renderWelcome(){root.innerHTML=`<div class="hero"><div class="tiny">AI LITERACY · STAFF SURVEY</div><h1>AI를 활용하는 방식,<br><em>우리의 판단을 살펴봅니다.</em></h1><p class="lead">생성형 AI를 얼마나 자주 사용하는지부터, 실제 업무상황에서 AI의 답변을 어떻게 검토하고 판단하는지까지 살펴보는 조사입니다.</p><div class="meta-chips"><span class="chip">◌ 로그인 불필요</span><span class="chip">✓ 총 21문항</span><span class="chip">⌕ 개인 평가 아님</span></div><button class="btn primary largebtn" id="start">설문 시작하기 <span aria-hidden="true">→</span></button><p class="note">교육 내용에 영향을 받지 않도록 관련 교육을 듣기 전에 응답해 주세요.</p><ul class="featurelist"><li>01 · 실제 AI 업무활용 경험</li><li>02 · 상황별 검토와 판단</li><li>03 · AI 작동방식의 이해</li><li>04 · 교육과 지원 수요</li></ul></div><div class="welcome-bottom"><strong>응답 안내</strong><br>이름·사번 등 직접 식별정보를 묻지 않습니다. 일부 문항은 2~3개를 선택하며, 잘못 선택한 답은 이전 화면에서 수정할 수 있습니다.<br><strong>시제품 안내:</strong> 현재는 화면·응답 흐름 테스트용이며 구글 스프레드시트로 응답이 전송되지 않습니다.</div>`;document.getElementById('start').onclick=onStart;}
function renderQuestion(){const q=findQ(number); if(!q){page='review';renderReview();return;}
const multiInfo=q.kind==='multi'?(q.min_select?`반드시 ${q.min_select}개 선택`:(q.limit?`최대 ${q.limit}개 선택`:'해당되는 항목 모두 선택')):'1개 선택';
root.innerHTML=`<section class="question-area">${questionHeader(q)}<div class="qhead"><div class="qkicker">QUESTION ${String(q.n).padStart(2,'0')}</div><h2 class="qtitle">${escapeHTML(q.title)}</h2></div>${q.case?makeCase(q):''}${q.intro?`<div class="qintro">${escapeHTML(q.intro)}</div>`:''}<div class="question">${escapeHTML(q.prompt)}</div><p class="hint">${escapeHTML(q.hint?q.hint+' · '+multiInfo:multiInfo)}</p>${makeChoices(q)}<div id="selectionStatus" class="selectionstatus" aria-live="polite"></div><p id="validationError" class="error" role="alert"></p><div class="navrow"><button id="back" class="btn secondary" type="button">← 이전</button><button id="next" class="btn primary" type="button">${q.n===21?'응답 검토하기':'다음 문항 →'}</button></div><p class="autonote">응답은 제출 전까지 이 화면에만 보관됩니다.</p></section>`;
const c=document.getElementById('toggleCase');if(c)c.onclick=()=>{caseExpanded=!caseExpanded;renderQuestion();};
for(const el of root.querySelectorAll('input[data-index]'))el.onchange=()=>select(q,+el.dataset.index);
const oi=document.getElementById('otherInput');if(oi)oi.oninput=e=>otherAnswer[q.n]=e.target.value;
document.getElementById('back').onclick=()=>{const arr=activeQuestions(),idx=arr.findIndex(x=>x.n===q.n);if(idx===0){page='welcome';}else{number=arr[idx-1].n;}render();gotoTop();};
document.getElementById('next').onclick=()=>{if(!valid(q)){const e=document.getElementById('validationError');e.textContent=q.min_select?`이 문항은 ${q.min_select}개를 선택해야 합니다.`:'이 문항의 답변을 선택해 주세요.';e.classList.add('show');e.scrollIntoView({block:'nearest'});return;}const arr=activeQuestions(),idx=arr.findIndex(x=>x.n===q.n);if(idx===arr.length-1){page='review';}else{number=arr[idx+1].n;}caseExpanded=false;render();gotoTop();};
updateStatus(q);
}
function updateStatus(q){const el=document.getElementById('selectionStatus');if(!el)return;const count=(answer[q.n]||[]).length;el.innerHTML=`${count?'선택한 답변 <strong>'+count+'개</strong>':''}${q.limit?' / 최대 '+q.limit+'개':''}`;const e=document.getElementById('validationError');if(e)e.classList.remove('show');}
function select(q,index){let arr=[...(answer[q.n]||[])];if(q.kind==='single'){arr=[index];}else{if(arr.includes(index)){arr=arr.filter(i=>i!==index);}else if(q.exclusive.includes(index)){arr=[index];}else{arr=arr.filter(i=>!q.exclusive.includes(i));if(q.limit&&arr.length>=q.limit){const error=document.getElementById('validationError');error.textContent=`최대 ${q.limit}개까지 선택할 수 있습니다.`;error.classList.add('show');return;}arr.push(index);arr.sort((a,b)=>a-b);}}answer[q.n]=arr;if(q.n===8&&arr.includes(4))delete answer[9];const previousOther=document.getElementById('otherInput');if(previousOther)otherAnswer[q.n]=previousOther.value;renderQuestion();if(q.other===index&&arr.includes(index)){let other=document.getElementById('otherInput');if(other)other.focus();}}
function renderReview(){const arr=activeQuestions();const missing=arr.filter(q=>!valid(q));root.innerHTML=`<div class="progressrow"><span class="subsection">제출 전 확인</span><span class="count">${answeredCount()} / ${arr.length} 응답</span></div><div class="flowline"><div class="fill" style="width:${Math.round(answeredCount()/arr.length*100)}%"></div></div><h1 class="review-title">응답을 확인해 주세요.</h1><p class="review-lead">응답한 문항을 돌아볼 수 있습니다. 각 항목의 ‘수정’을 누르면 해당 질문으로 이동합니다.</p>${SECTIONS.map((name,sect)=>`<div class="review-group"><h3>${escapeHTML(name)}</h3>${arr.filter(q=>q.section===sect).map(q=>`<div class="review-item"><span>${q.n}. ${escapeHTML(q.title)}</span><span style="display:flex;align-items:center;gap:8px;white-space:nowrap;color:${valid(q)?'#43827d':'#b46b50'}">${valid(q)?'✓ 응답':'미응답'} <button type="button" data-go="${q.n}">수정</button></span></div>`).join('')}</div>`).join('')}<div class="readytext">${missing.length?`미응답 문항 ${missing.length}개가 있습니다. 해당 문항에 응답하면 테스트를 마칠 수 있습니다.`:'모든 문항에 응답했습니다. 현재 화면은 테스트용이며 실제 설문 응답이 서버로 전송되지는 않습니다.'}</div><div class="navrow"><button class="btn secondary" id="backToQuestion">← 돌아가기</button><button class="btn primary" id="confirm" ${missing.length?'disabled':''}>테스트 완료하기</button></div>`;
for(const btn of root.querySelectorAll('[data-go]'))btn.onclick=()=>{number=+btn.dataset.go;page='question';render();gotoTop()};document.getElementById('backToQuestion').onclick=()=>{number=arr[arr.length-1].n;page='question';render();gotoTop()};document.getElementById('confirm').onclick=()=>{if(missing.length)return;page='done';render();gotoTop()};}
function renderDone(){root.innerHTML=`<div class="finish-hero"><div class="finishicon">✓</div><div class="tiny">SURVEY PREVIEW COMPLETED</div><h2>응답 화면 테스트가 완료되었습니다.</h2><p>21문항의 응답·선택 제한·화면 이동을 확인했습니다.<br>현재 버전은 스프레드시트 저장이 연결되지 않은 시제품입니다.</p></div><div class="warning"><strong>중요:</strong> 구글 스프레드시트 저장은 아직 연결되지 않았습니다. 실제 조사에서는 이 완료 화면을 응답 제출 성공 메시지로 변경합니다.</div><div class="finish-controls"><button id="download" class="btn primary largebtn">테스트 응답 CSV 저장 ↓</button><button id="edit" class="btn secondary largebtn">응답 검토 화면으로 돌아가기</button><button id="restart" class="btn secondary largebtn">처음부터 다시 시작</button></div><p class="note">CSV 파일은 기기에만 내려받으며 서버로 전송되지 않습니다.</p>`;
document.getElementById('download').onclick=downloadCSV;document.getElementById('edit').onclick=()=>{page='review';render();gotoTop()};document.getElementById('restart').onclick=()=>{if(!confirm('현재 응답을 초기화하고 다시 시작하시겠습니까?'))return;for(const k in answer)delete answer[k];for(const k in otherAnswer)delete otherAnswer[k];page='welcome';number=1;render();gotoTop()};}
function downloadCSV(){const header=['response_id','test_completed_at',...questions.map(q=>'Q'+q.n),...questions.filter(q=>q.other!==null).map(q=>'Q'+q.n+'_other')];const respId='TEST-'+new Date().toISOString().replace(/\D/g,'').slice(0,14)+'-'+Math.random().toString(36).slice(2,7);const row=[respId,new Date().toISOString(),...questions.map(q=>(q.n===9&&!activeQuestions().some(x=>x.n===9))?'SKIPPED':(answer[q.n]||[]).map(i=>String(i+1)).join(';')),...questions.filter(q=>q.other!==null).map(q=>otherAnswer[q.n]||'')];const csv='\ufeff'+header.map(csvcell).join(',')+'\r\n'+row.map(csvcell).join(',')+'\r\n';const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='ulju_ai_survey_test_'+new Date().toISOString().slice(0,10)+'.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function csvcell(x){const s=String(x);return /[",\r\n]/.test(s)?'"'+s.replaceAll('"','""')+'"':s}
render();
</script>
</body>
</html>
