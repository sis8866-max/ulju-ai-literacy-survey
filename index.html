o.selected{background:var(--soft);border-color:var(--primary)}.prio.selected .badge{background:var(--primary);color:white}.rankwrap{display:grid;gap:8px;margin-left:52px}.rankrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border:1px solid #dbe4ec;border-radius:12px;padding:11px 12px}.ranklabel{font-size:14px}.rankbuttons{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.rankbtn{min-width:34px;height:31px;border:1px solid #cad6e0;background:#f8fafc;border-radius:8px;font-weight:800;color:#405365;cursor:pointer}.rankbtn.active{background:var(--primary);border-color:var(--primary);color:white}.rankbtn.used:not(.active){opacity:.23;cursor:not-allowed}.other,.free textarea{width:calc(100% - 52px);margin:9px 0 0 52px;border:1px solid #cfdbe5;border-radius:10px;padding:10px 12px;font:inherit}.free{margin:15px 0 0 52px;padding:13px 14px;border:1px solid #e0e7ee;background:#f8fafc;border-radius:12px}.free textarea{width:100%;margin:8px 0 0;resize:vertical}.err{outline:3px solid rgba(189,61,53,.17);border-radius:12px}.errmsg{color:var(--danger);font-size:13px;font-weight:700;margin:8px 0 0 52px}.bottom{position:sticky;bottom:0;z-index:20;background:rgba(243,246,250,.96);backdrop-filter:blur(7px);border-top:1px solid #dce5ed;padding:11px 0}.bottomin{max-width:980px;margin:auto;padding:0 18px;display:flex;justify-content:space-between;gap:10px;align-items:center}.status{font-size:13px;color:var(--muted)}.buttons{display:flex;gap:8px}.btn{border:0;border-radius:11px;padding:11px 17px;font:inherit;font-weight:800;cursor:pointer}.btn.secbtn{background:#fff;color:#345;border:1px solid #cdd8e3}.btn.main{background:var(--primary);color:white}@media(max-width:720px){.wrap{padding:0 11px}.hero{padding:23px 19px;border-radius:16px}.hero h1{font-size:23px}.sec{padding:17px 13px}.choices,.note,.scenario,.prioSummary,.prioList,.rankwrap,.free{margin-left:0}.other,.free textarea{width:100%;margin-left:0}.rankrow{grid-template-columns:1fr}.rankbuttons <div class="wrap"><header class="hero"><div class="kicker">ULJU · AI LITERACY SURVEY</div><h1>공직자 생성형 AI 활용 및 AI 리터러시 설문조사</h1><p>생성형 AI를 업무에서 어떻게 활용하고 판단하는지, 그리고 어떤 지원이 필요한지 알아보기 위한 조사입니다.</p><div class="notice">개인의 AI 활용능력을 평가하거나 순위를 매기기 위한 설문이 아닙니다. 활용 경험이 많지 않더라도 응답할 수 있으며, 직접 경험이 없는 상황은 실제 업무에서 어떻게 판단하거나 대응할 것 같은지를 기준으로 답해 주세요.</div></header><form id="form"></form></div>

<script>
const SURVEY={"title": "공직자 생성형 AI 활용 및 AI 리터러시 설문조사", "sections": [{"no": "01", "title": "AI 활용현황", "desc": "현재 어떤 방식으로 AI를 활용하고 있는지 묻습니다.", "questions": [{"id": "q1", "type": "single", "text": "현재 생성형 AI를 업무에 어느 정도 활용하고 있습니까?", "options": ["거의 사용하지 않는다.", "필요할 때 가끔 사용한다.", "일부 업무에서 비교적 자주 사용한다.", "여러 업무에서 일상적으로 사용한다.", "대부분의 업무과정에서 자연스럽게 활용하고 있다."]}, {"id": "q2", "type": "single", "text": "현재 본인의 업무를 수행하는 데 생성형 AI는 어느 정도 필요하다고 생각하십니까?", "options": ["거의 필요하지 않다.", "있으면 편리하지만 없어도 충분하다.", "일부 업무에서는 꽤 필요하다.", "업무의 효율이나 완성도를 높이는 데 중요한 도구이다.", "효과적으로 업무를 수행하기 위해 사실상 필수적인 도구이다."]}, {"id": "q3", "type": "multi", "text": "생성형 AI를 업무에 활용해 본 경우, 주로 어떤 업무에 활용하고 있습니까?", "max": 3, "exclusive": [8], "other": 9, "note": "최대 3개 선택 · ⑧은 다른 항목과 함께 선택할 수 없습니다.", "options": ["법령·사례·쟁점 등의 검토·비교", "자료의 요약·정리", "반복업무의 절차화·자동화 또는 업무도구 제작", "새로운 업무나 필요한 자료를 찾고 이해하는 데 활용", "아이디어·대안·검토사항 발굴", "보고서·공문·메일 등의 초안 작성이나 문장 개선", "통계·엑셀·데이터·코드 등의 처리", "업무에는 거의 활용하지 않음", "기타"]}]}, {"no": "02", "title": "AI 활용 경험과 판단", "desc": "정답을 맞히기보다 실제 업무에서 어떻게 판단할지를 기준으로 응답해 주세요.", "questions": [{"id": "q4", "type": "single", "text": "평소 생성형 AI의 답변을 어느 정도 신뢰하는 편입니까?", "options": ["거의 신뢰하지 않는다.", "별로 신뢰하지 않는다.", "어느 정도 신뢰한다.", "상당히 신뢰한다.", "대부분 신뢰한다."]}, {"id": "q5", "type": "single", "text": "위와 같이 생각하는 데 가장 크게 영향을 미친 것은 무엇입니까?", "options": ["실제로 사용해 보면 내가 직접 찾거나 정리하는 것보다 유용한 답을 얻는 경우가 많기 때문이다.", "질문이나 제공하는 자료에 따라 답변의 품질이 크게 달라진다고 느끼기 때문이다.", "완벽하지 않더라도 필요한 부분을 확인하고 보완하면서 충분히 활용할 수 있다고 생각하기 때문이다.", "AI가 틀린 정보나 불확실한 근거를 제시하는 경우가 있기 때문이다.", "업무의 내용이나 난이도에 따라 AI를 믿고 활용할 수 있는 정도가 다르다고 생각하기 때문이다."]}, {"id": "q6", "type": "levels", "text": "현재 본인이 생각하는 생성형 AI의 업무 활용수준은 어디에 가장 가깝습니까?", "note": "실제 능력을 평가하는 문제가 아니라 현재 본인이 생각하는 활용수준을 묻는 문항입니다. 각 단계는 이전 단계의 활용을 포함한다고 보고 응답해 주세요.", "options": [{"title": "아직 업무에 활용하기 어렵다.", "desc": "AI를 어떻게 활용해야 할지 잘 모르거나 간단한 질문 정도만 할 수 있다."}, {"title": "간단한 자료정리나 문서작성에 활용할 수 있다.", "desc": "자료 요약, 문장 다듬기, 이메일·보고서 초안 작성 등에 활용할 수 있다."}, {"title": "업무 목적에 맞게 AI의 결과를 조정할 수 있다.", "desc": "필요한 배경과 조건을 설명하고 원하는 형식이나 내용으로 수정·보완할 수 있다."}, {"title": "복잡한 업무의 검토·분석에도 활용할 수 있다.", "desc": "여러 자료를 비교하고 쟁점·대안·예외사항을 검토하며 주요 근거를 확인하면서 활용할 수 있다."}, {"title": "AI를 활용해 업무방식을 개선할 수 있다.", "desc": "반복업무의 절차·판단조건·주의사항 등을 정리하고 반복해서 활용할 수 있는 방식이나 도구로 발전시킬 수 있다."}]}, {"id": "q7", "type": "priority4", "text": "다음 상황에서 AI의 결과를 실제 업무에 활용하기 위해 추가로 조치하려고 합니다. 아래 행동 중 본인이 우선적으로 할 것 같은 4가지를 실제 처리할 순서대로 선택해 주세요.", "scenario": "생성형 AI에게 업무 검토보고서 초안을 작성하도록 요청했습니다. 결과에는 활용할 만한 내용도 있지만 일부 업무조건이 충분히 반영되지 않았고, 근거가 정확한지 확인이 필요한 내용도 있습니다. 필요한 경우 질문을 바꾸거나 추가자료를 활용하여 결과를 보완할 수 있습니다.", "options": [["E", "AI에게 근거와 출처를 다시 제시하도록 요청하고 답변을 보완한다."], ["B", "추가자료의 개인정보·내부정보 여부를 확인하고 필요한 내용만 골라 제공한다."], ["G", "기존 업무자료나 유사 사례와 비교해 활용할 수 있는 내용을 추려낸다."], ["A", "질문을 더 구체적으로 바꾸고 원하는 형식·조건을 덧붙여 다시 요청한다."], ["H", "법령·수치 등 핵심내용은 원자료로 확인하고 최종 판단은 직접 정리한다."], ["C", "다른 생성형 AI에도 같은 내용을 물어보고 답변의 차이를 비교해 본다."], ["F", "복잡한 요청은 쟁점별로 나누고 각 단계에 필요한 자료와 조건을 제공한다."], ["D", "답변이 기대와 다른 이유를 살펴보고 업무 목적과 판단기준을 다시 정리한다."]]}, {"id": "q8", "type": "single", "text": "생성형 AI가 법령·통계·사례 등을 포함한 답변을 제시했습니다. 이 내용을 실제 업무에 활용하려고 할 때, 본인이 할 것 같은 방식과 가장 가까운 것은 무엇입니까?", "options": ["기존 결재문서나 본인의 업무경험과 크게 어긋나지 않는지 확인한 뒤 활용한다.", "AI가 구체적으로 제시한 법령 조항·통계수치·연도·금액·사실관계 등은 공식자료나 원자료에서 직접 확인한 뒤 활용한다.", "AI에게 출처와 근거를 다시 물어보고, 답변에 모순이 없는지 확인한 뒤 활용한다.", "포털사이트나 다른 생성형 AI에서도 비슷한 내용이 나오는지 비교해 본 뒤 활용한다.", "AI가 제시한 출처가 구체적이고 설명도 충분하다면 별도로 확인이 필요한 부분만 추가로 찾아본 뒤 활용한다."]}, {"id": "q9", "type": "single", "text": "외부 상용 생성형 AI에 업무자료를 활용하는 것에 대한 본인의 생각과 가장 가까운 것은 무엇입니까?", "options": ["업무상 필요성이 충분하다면 내부자료도 필요한 부분만 선별하여 활용할 수 있다고 생각한다.", "AI가 자료를 학습하지 않도록 설정하면 내부자료도 활용할 수 있다고 생각한다.", "개인정보나 내부자료가 포함될 가능성이 있으므로 외부 생성형 AI는 업무에 사용하지 않는 것이 안전하다고 생각한다.", "개인정보만 제거하면 대부분의 업무자료는 활용할 수 있다고 생각한다.", "기관의 이용기준과 자료의 성격을 확인하고 외부 제공이 가능한 범위의 정보만 활용해야 한다고 생각한다."]}, {"id": "q10", "type": "single", "text": "민원처리 사례를 검토하기 위해 외부 상용 생성형 AI의 도움을 받고 싶습니다. 자료에는 민원인의 개인정보와 아직 외부에 공개되지 않은 업무내용이 포함되어 있습니다. 이 경우 본인이 할 것 같은 방식과 가장 가까운 것은 무엇입니까?", "options": ["실제 자료는 입력하지 않고, 필요한 업무쟁점만 일반적인 상황  if(q.type==='single'||q.type==='levels'){body+='<div class="choices">'+q.options.map((o,i)=>{const t=typeof o==='string'?o:o.title,d=typeof o==='string'?'':o.desc;return `<label class="choice"><input type="radio" name="${q.id}" value="${i+1}" data-label="${esc(t)}"><span class="idx">${i+1}</span><span class="ct">${q.type==='levels'?'<strong>'+esc(t)+'</strong>':esc(t)}${d?'<small>'+esc(d)+'</small>':''}</span><span class="tick">✓</span></label>`}).join('')+'</div>'}
 if(q.type==='multi'){body+='<div class="choices">'+q.options.map((o,i)=>`<label class="choice"><input type="checkbox" name="${q.id}" value="${i+1}" data-label="${esc(o)}" ${q.exclusive?.includes(i+1)?'data-exclusive="1"':''}><span class="idx">${i+1}</span><span class="ct">${esc(o)}</span><span class="tick">✓</span></label>`).join('')+'</div>';if(q.other)body+=`<input id="${q.id}_other" class="other" placeholder="기타 내용을 입력해 주세요" style="display:none">`}
 if(q.type==='priority4'){body+=`<div class="prioSummary">선택 순서 · <b id="q7sum">아직 선택하지 않았습니다.</b></div><div class="prioList">`+q.options.map(x=>`<button type="button" class="prio" data-code="${x[0]}"><span class="badge"></span><span class="code">${x[0]}</span><span>${esc(x[1])}</span></button>`).join('')+'</div><div class="note">총 4개를 선택합니다. 다시 누르면 취소됩니다.</div>'}
 if(q.type==='ranking'){body+=`<div class="note">${q.maxScore}점부터 1점까지 각 점수는 한 번씩만 사용해 주세요.</div><div class="rankwrap">`+q.options.map((o,i)=>`<div class="rankrow" data-item="${i+1}" data-label="${esc(o)}"><div class="ranklabel">${esc(o)}</div><div class="rankbuttons">${Array.from({length:q.maxScore},(_,k)=>q.maxScore-k).map(s=>`<button type="button" class="rankbtn" data-score="${s}">${s}</button>`).join('')}</div></div>`).join('')+'</div>';if(q.freeText)body+=`<div class="free"><label for="${q.id}_free"><b>${esc(q.freeText)}</b></label><textarea id="${q.id}_free" rows="3" placeholder="선택 입력"></textarea></div>`}
 return `<article class="q" id="${q.id}" data-type="${q.type}" ${q.max?`data-max="${q.max}"`:''} ${q.maxScore?`data-rank-max="${q.maxScore}"`:''}><div class="qh"><span class="qn">Q${qnum(q.id)}</span><h3>${esc(q.text)}</h3></div>${body}</article>`}
function render(){form.innerHTML=SURVEY.sections.map(s=>`<section class="sec"><div class="sectitle"><span>${s.no}</span><div><h2>${esc(s.title)}</h2><p>${esc(s.desc)}</p></div></div>${s.questions.map(renderQuestion).join('')}</section>`).join('');bind()}
function bind(){document.querySelectorAll('[data-max]').forEach(q=>{const boxes=[...q.querySelectorAll('input[type=checkbox]')];boxes.forEach(b=>b.onchange=()=>{if(b.checked&&b.dataset.exclusive==='1')boxes.forEach(x=>{if(x!==b)x.checked=false});else if(b.checked){boxes.filter(x=>x.dataset.exclusive==='1').forEach(x=>x.checked=false);if(boxes.filter(x=>x.checked).length>+q.dataset.max)b.checked=false}toggleOther(q.id);update()})});
 document.querySelectorAll('input[type=radio]').forEach(x=>x.onchange=update);document.querySelectorAll('#q7 .prio').forEach(b=>b.onclick=()=>{const c=b.dataset.code,i=state.q7.indexOf(c);if(i>=0)state.q7.splice(i,1);else if(state.q7.length<4)state.q7.push(c);renderQ7();update()});
 document.querySelectorAll('[data-rank-max]').forEach(q=>{q.querySelectorAll('.rankbtn').forEach(b=>b.onclick=()=>{const r=b.closest('.rankrow'),s=b.dataset.score;if(r.dataset.score===s)delete r.dataset.score;else r.dataset.score=s;renderRank(q);update()});renderRank(q)});toggleOther('q3');toggleOther('q16')}
function toggleOther(id){const q=SURVEY.sections.flatMap(s=>s.questions).find(x=>x.id===id);if(!q?.other)return;const el=document.getElementById(id+'_other'),ck=form.querySelector(`input[name="${id}"][value="${q.other}"]`)?.checked;el.style.display=ck?'block':'none';if(!ck)el.value=''}
function renderQ7(){document.querySelectorAll('#q7 .prio').forEach(b=>{const i=state.q7.indexOf(b.dataset.code);b.classList.toggle('selected',i>=0);b.querySelector('.badge').textContent=i>=0?i+1:''});document.getElementById('q7sum').textContent=state.q7.length?state.q7.map((c,i)=>`${i+1}순위 ${c}`).join(' → '):'아직 선택하지 않았습니다.'}
function renderRank(q){const used=[...q.querySelectorAll('.rankrow')].map(r=>r.dataset.score).filter(Boolean);q.querySelectorAll('.rankbtn').forEach(b=>{const r=b.closest('.rankrow'),a=r.dataset.score===b.dataset.score;b.classList.toggle('active',a);b.classList.toggle('used',!a&&used.includes(b.dataset.score));b.disabled=!a&&used.includes(b.dataset.score)})}
function complete(id){const q=document.getElementById(id),t=q.dataset.type;if(t==='priority4')return state.q7.length===4;if(t==='ranking'){const m=+q.dataset.rankMax,rs=[...q.querySelectorAll('.rankrow')],v=rs.map(r=>r.dataset.score).filter(Boolean);return rs.length===m&&new Set(v).size===m}if(t==='multi')return q.querySelectorAll('input:checked').length>0;return !!q.querySelector('input:checked')}
function update(){let d=0;for(let i=1;i<=TOTAL;i++)if(complete('q'+i))d++;const p=Math.round(d/TOTAL*100);progressText.textContent=`${d} / ${TOTAL} 문항`;progressPct.textContent=p+'%';progressBar.style.width=p+'%'}
function validate(){const bad=[];for(let i=1;i<=TOTAL;i++){const q=document.getElementById('q'+i);q.classList.remove('err');q.querySelector('.errmsg')?.remove();if(!complete('q'+i)){q.classList.add('err');const e=document.createElement('div');e.className='errmsg';e.textContent='이 문항에 응답해 주세요.';q.appendChild(e);bad.push(q)}}return bad}
function radio(id){const e=form.querySelector(`input[name="${id}"]:checked`);return e?{value:+e.value,label:e.dataset.label}:null}function multi(id){const a=[...form.querySelectorAll(`input[name="${id}"]:checked`)].map(e=>({value:+e.value,label:e.dataset.label})),o=document.getElementById(id+'_other');if(o?.value.trim())a.push({value:'other_text',label:o.value.trim()});return a}function ranking(id){return [...document.querySelectorAll(`#${id} .rankrow`)].map((r,i)=>({item:i+1,label:r.dataset.label,score:+r.dataset.score})).sort((a,b)=>b.score-a.score)}
function makeId(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',a=new Uint32Array(12);crypto.getRandomValues(a);let s='';a.forEach((x,i)=>{s+=c[x%c.length];if(i===3||i===7)s+='-'});return s}const RID=makeId();
function collect(){const A={};[1,2,4,5,6,8,9,10,11,12,15,19,20,21].forEach(n=>A['q'+n]=radio('q'+n));A.q3=multi('q3');const opts=Object.fromEntries(SURVEY.sections.flatMap(s=>s.questions).find(x=>x.id==='q7').options);A.q7=state.q7.map((c,i)=>({rank:i+1,code:c,label:opts[c]}));A.q13=ranking('q13');A.q14=multi('q14');A.q16=multi('q16');A.q17=ranking('q17');A.q18={ranking:ranking('q18'),other:document.getElementById('q18_free').value.trim()};return {respondent_id:RID,answers:A}}
function resultHTML(d){const A=d.answers,R=[];const s=n=>R.push(`<tr><th>Q${n}</th><td>${esc(A['q'+n].label)}</td></tr>`);[1,2].forEach(s);R.push(`<tr><th>Q3</th><td>${A.q3.map(x=>esc(x.label)).join('<br>')}</td></tr>`);[4,5,6].forEach(s);R.push(`<tr><th>Q7</th><td>${A.q7.map(x=>`${x.rank}순위 ${esc(x.code)} — ${esc(x.label)}`).join('<br>')}</td></tr>`);[8,9,10,11,12].forEach(s);R.push(`<tr><th>Q13</th><td>${A.q13.map(x=>`${x.score}점 — ${esc(x.label)}`).join('<br>')}</td></tr><tr><th>Q14</th><td>${A.q14.map(x=>esc(x.label)).join('<br>')}</td></tr>`);s(15);R.push(`<tr><th>Q16</th><td>${A.q16.map(x=>esc(x.label)).join('<br>')}</td></tr><tr><th>Q17</th><td>${A.q17.map(x=>`${x.score}점 — ${esc(x.label)}`).join('<br>')}</td></tr><tr><th>Q18</th><td>${A.q18.ranking.map(x=>`${x.score}점 — ${esc(x.label)}`).join('<br>')}${A.q18.other?'<br><b>기타 의견:</b> '+esc(A.q18.other):''}</td></tr>`);[19,20,21].forEach(s);const j=JSON.stringify(d).replace(/</g,'\\u003c');return `<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>AI 리터러시 설문 응답 ${esc(d.respondent_id)}</title><style>body{font-family:"Malgun Gothic",sans-serif;margin:24px;color:#17212b;line-height:1.55}.w{max-width:900px;margin:auto}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccd7e0;padding:10px;vertical-align:top}th{width:70px;background:#f5f7f9}.id{padding:12px;background:#f1f5f8;border-radius:9px;margin:12px 0 18px}</style></head><body><div class="w"><h1>공직자 생성형 AI 활용 및 AI 리터러시 설문 응답</h1><div class="id"><b>응답번호:</b> ${esc(d.respondent_id)}</div><table>${R.join('')}</table><script id="survey-data" type="application/json">${j}<\/script></div></body></html>`}
jump.onclick=()=>{const b=validate();if(b.length)b[0].scrollIntoView({behavior:'smooth',block:'center'});else status.textContent='모든 필수 문항에 응답했습니다.'};save.onclick=()=>{const b=validate();if(b.length){status.textContent=`미응답 문항이 ${b.length}개 있습니다.`;b[0].scrollIntoView({behavior:'smooth',block:'center'});return}const d=collect(),blob=new Blob([resultHTML(d)],{type:'text/html;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`AI설문_${d.respondent_id}.html`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);status.textContent='응답파일을 저장했습니다.'};reset.onclick=()=>{if(!confirm('모든 응답을 초기화할까요?'))return;form.reset();state.q7=[];document.querySelectorAll('.rankrow').forEach(r=>delete r.dataset.score);renderQ7();document.querySelectorAll('[data-rank-max]').forEach(renderRank);document.querySelectorAll('.q').forEach(q=>{q.classList.remove('err');q.querySelector('.errmsg')?.remove()});toggleOther('q3');toggleOther('q16');document.getElementById('q18_free').value='';update();window.scrollTo({top:0,behavior:'smooth'})};render();update();
</script></body></html>
